<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extensions | SuperUser</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #131a1f, #09090b 70%);
      color: #f4f4f5;
      padding: 20px 18px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main { width: min(900px, 100%); display: flex; flex-direction: column; gap: 18px; }
    h1 { font-size: 22px; font-weight: 700; color: #22c55e; }
    .subtitle { font-size: 13px; color: #a1a1aa; margin-top: 2px; }
    .card {
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 18px;
    }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #f4f4f5; }
    .install-row { display: flex; gap: 8px; }
    .install-row input {
      flex: 1; min-width: 0;
      background: #09090b; border: 1px solid #27272a; border-radius: 8px;
      color: #f4f4f5; font: inherit; font-size: 13px;
      padding: 0 12px; height: 38px; outline: none;
      transition: border-color 0.15s;
    }
    .install-row input:focus { border-color: #22c55e; }
    button {
      background: #22c55e; border: none; border-radius: 8px;
      color: #06120a; font: inherit; font-size: 13px; font-weight: 600;
      padding: 0 16px; height: 38px; cursor: pointer; white-space: nowrap;
      transition: filter 0.15s;
    }
    button:hover { filter: brightness(1.08); }
    button.danger {
      background: transparent; border: 1px solid #3f3f46;
      color: #ef4444; font-weight: 500;
    }
    button.danger:hover { background: rgba(239,68,68,0.1); border-color: #ef4444; }
    button.secondary {
      background: transparent; border: 1px solid #3f3f46;
      color: #a1a1aa; font-weight: 500;
    }
    button.secondary:hover { background: #18181b; color: #f4f4f5; }
    .ext-list { display: flex; flex-direction: column; gap: 2px; }
    .ext-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid #1e1e1e;
    }
    .ext-row:last-child { border-bottom: none; }
    .ext-info { flex: 1; min-width: 0; }
    .ext-title { font-size: 13px; font-weight: 500; }
    .ext-id { font-size: 11px; color: #71717a; margin-top: 2px; font-family: monospace; }
    .ext-badge {
      font-size: 10px; padding: 1px 7px; border-radius: 999px;
      background: rgba(34,197,94,0.12); color: #22c55e;
      border: 1px solid rgba(34,197,94,0.25); white-space: nowrap;
    }
    .ext-badge.custom { background: rgba(6,182,212,0.1); color: #06b6d4; border-color: rgba(6,182,212,0.25); }
    /* Toggle switch */
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: #27272a;
      border-radius: 999px; cursor: pointer; transition: background 0.2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; height: 14px; width: 14px;
      left: 3px; bottom: 3px; background: #71717a;
      border-radius: 50%; transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: rgba(34,197,94,0.2); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: #22c55e; }
    .empty-msg { text-align: center; color: #52525b; font-size: 13px; padding: 24px 0; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #18181b; border: 1px solid #27272a; border-radius: 10px;
      padding: 10px 18px; font-size: 13px; color: #f4f4f5;
      opacity: 0; pointer-events: none; transition: all 0.25s;
      z-index: 999; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: rgba(34,197,94,0.4); color: #22c55e; }
    .toast.err { border-color: rgba(239,68,68,0.4); color: #ef4444; }
    .loading { text-align: center; color: #52525b; font-size: 13px; padding: 16px 0; }
    .header { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="header">
      <h1>Extensions</h1>
      <div class="subtitle">Manage userscripts and site enhancements.</div>
    </div>

    <div class="card">
      <h2>Install from URL</h2>
      <div class="install-row">
        <input id="installUrl" type="url" placeholder="https://greasyfork.org/... or raw .user.js URL" autocomplete="off" spellcheck="false">
        <button id="installBtn">Install</button>
      </div>
    </div>

    <div class="card">
      <h2>Installed Extensions</h2>
      <div class="ext-list" id="extList">
        <div class="loading">Loading extensions…</div>
      </div>
    </div>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const EXTENSIONS_KEY = 'superuser-extensions';
    const CUSTOM_KEY = 'superuser-custom-extensions';

    let builtinCatalog = [];
    let customCatalog = [];
    let enabledExtensions = {};

    function loadEnabled() {
      try { enabledExtensions = JSON.parse(localStorage.getItem(EXTENSIONS_KEY) || '{}'); } catch (_) {}
    }
    function saveEnabled() {
      localStorage.setItem(EXTENSIONS_KEY, JSON.stringify(enabledExtensions));
    }
    function loadCustom() {
      try { customCatalog = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]'); } catch (_) { customCatalog = []; }
    }
    function saveCustom() {
      localStorage.setItem(CUSTOM_KEY, JSON.stringify(customCatalog));
    }

    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2800);
    }

    function getAllExtensions() {
      return [
        ...builtinCatalog.map(e => ({ ...e, custom: false })),
        ...customCatalog.map(e => ({ ...e, custom: true }))
      ];
    }

    function renderExtensions() {
      const list = document.getElementById('extList');
      const all = getAllExtensions();
      if (!all.length) {
        list.innerHTML = '<div class="empty-msg">No extensions installed.</div>';
        return;
      }
      list.innerHTML = all.map(ext => {
        const checked = enabledExtensions[ext.id] !== false ? 'checked' : '';
        return `
        <div class="ext-row" data-ext-id="${escHtml(ext.id)}">
          <div class="ext-info">
            <div class="ext-title">${escHtml(ext.title || ext.id)}</div>
            <div class="ext-id">${escHtml(ext.id)}</div>
          </div>
          <span class="ext-badge${ext.custom ? ' custom' : ''}">${ext.custom ? 'Custom' : 'Built-in'}</span>
          <label class="toggle" title="${checked ? 'Disable' : 'Enable'}">
            <input type="checkbox" data-toggle="${escHtml(ext.id)}" ${checked}>
            <span class="toggle-slider"></span>
          </label>
          ${ext.custom ? `<button class="danger" data-delete="${escHtml(ext.id)}">Remove</button>` : ''}
        </div>`;
      }).join('');

      list.querySelectorAll('[data-toggle]').forEach(cb => {
        cb.addEventListener('change', e => {
          const id = e.target.dataset.toggle;
          enabledExtensions[id] = e.target.checked;
          saveEnabled();
          notifyParent({ type: 'superuser:ext-toggle', id, enabled: e.target.checked });
          toast(`${id} ${e.target.checked ? 'enabled' : 'disabled'}`);
        });
      });

      list.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', e => {
          const id = e.target.dataset.delete;
          if (!confirm(`Remove extension "${id}"?`)) return;
          customCatalog = customCatalog.filter(x => x.id !== id);
          saveCustom();
          delete enabledExtensions[id];
          saveEnabled();
          notifyParent({ type: 'superuser:ext-delete', id });
          renderExtensions();
          toast(`Removed ${id}`, 'ok');
        });
      });
    }

    function notifyParent(msg) {
      try { window.parent.postMessage(msg, '*'); } catch (_) {}
    }

    function parseMetadata(src) {
      const meta = {};
      const block = src.match(/\/\/\s*==UserScript==([\s\S]*?)\/\/\s*==\/UserScript==/);
      if (!block) return meta;
      for (const line of block[1].split('\n')) {
        const m = line.match(/\/\/\s*@(\w+)\s+(.+)/);
        if (m) {
          const key = m[1].trim();
          const val = m[2].trim();
          if (!meta[key]) meta[key] = val;
          else if (!Array.isArray(meta[key])) meta[key] = [meta[key], val];
          else meta[key].push(val);
        }
      }
      return meta;
    }

    function domainFromMatch(match) {
      if (!match) return null;
      const matches = Array.isArray(match) ? match : [match];
      for (const m of matches) {
        const parts = m.replace(/^\*:\/\//, '').replace(/\/.*$/, '').replace(/^\*\./, '');
        if (parts && parts !== '*') return parts;
      }
      return null;
    }

    async function installFromUrl(url) {
      // Handle GreasyFork: convert to raw URL
      let rawUrl = url;
      const gfMatch = url.match(/greasyfork\.org\/.*?\/scripts\/(\d+)/);
      if (gfMatch) {
        rawUrl = `https://update.greasyfork.org/scripts/${gfMatch[1]}/${gfMatch[1]}.user.js`;
      }
      toast('Fetching script…', 'ok');
      let src;
      try {
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        src = await res.text();
      } catch (e) {
        toast('Failed to fetch: ' + e.message, 'err');
        return;
      }
      const meta = parseMetadata(src);
      const name = meta.name || rawUrl.split('/').pop() || 'Unknown Script';
      const matchDomain = domainFromMatch(meta.match);
      const id = matchDomain || name.toLowerCase().replace(/[^a-z0-9]/gi, '_');
      const existing = customCatalog.findIndex(x => x.id === id);
      const entry = { id, title: name, url: rawUrl, src };
      if (existing >= 0) customCatalog[existing] = entry;
      else customCatalog.push(entry);
      saveCustom();
      enabledExtensions[id] = true;
      saveEnabled();
      notifyParent({ type: 'superuser:ext-install', meta: entry });
      renderExtensions();
      toast(`Installed: ${name}`, 'ok');
    }

    document.getElementById('installBtn').addEventListener('click', () => {
      const url = document.getElementById('installUrl').value.trim();
      if (!url) { toast('Enter a URL', 'err'); return; }
      installFromUrl(url);
    });
    document.getElementById('installUrl').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('installBtn').click();
    });

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function init() {
      loadEnabled();
      loadCustom();
      try {
        // Try to fetch built-in catalog relative to parent (since we're in internals/extensions/)
        const res = await fetch(new URL('../../extensions/scripts/index.json', location.href), { cache: 'no-store' });
        if (res.ok) builtinCatalog = await res.json();
      } catch (_) {}
      // Ensure youtube.com enabled by default
      if (!('youtube.com' in enabledExtensions)) enabledExtensions['youtube.com'] = true;
      renderExtensions();
    }

    // Listen for parent messages (e.g. ext-install triggered from navigation interception)
    window.addEventListener('message', e => {
      if (e.data?.type === 'superuser:ext-install-external') {
        loadCustom();
        loadEnabled();
        renderExtensions();
      }
    });

    init();
  </script>
</body>
</html>
