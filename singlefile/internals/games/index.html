<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games | SuperUser</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 18px 18px;
      background: radial-gradient(ellipse at top, #14221a, #09090b 70%);
      color: #f4f4f5;
    }
    main { width: min(1200px, 100%); display: flex; flex: 1; flex-direction: column; gap: 10px; }
    form { display: grid; grid-template-columns: minmax(0, 1fr) auto 170px auto auto; gap: 10px; align-items: center; }
    input, select, button {
      min-height: 48px;
      border: 1px solid #27272a;
      border-radius: 10px;
      background: #111113;
      color: #f4f4f5;
      font: inherit;
    }
    .provider-label { align-self: center; color: #a1a1aa; font-size: 13px; }
    input { min-width: 0; flex: 1; padding: 0 14px; outline: none; }
    input:focus, select:focus { border-color: #22c55e; }
    select { width: 100%; padding: 0 10px; cursor: pointer; }
    button.primary { padding: 0 18px; border-color: #22c55e; background: #22c55e; color: #06120a; font-weight: 700; cursor: pointer; }
    button.primary:hover { filter: brightness(1.08); }
    button.icon-btn {
      padding: 0;
      width: 48px;
      border-color: #27272a;
      background: #111113;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    button.icon-btn:hover { border-color: #22c55e; background: rgba(34,197,94,0.08); }
    button.icon-btn svg { pointer-events: none; }
    #status { min-height: 18px; color: #a1a1aa; font-size: 12px; }
    #providerFrame {
      flex: 1; min-height: calc(100vh - 105px); width: 100%;
      border: 1px solid #27272a; border-radius: 12px; background: #09090b;
    }
    /* Fullscreen mode */
    body.fs-mode form,
    body.fs-mode #status { display: none; }
    body.fs-mode #providerFrame {
      position: fixed; inset: 0; z-index: 9999;
      border-radius: 0; border: none; min-height: unset;
    }
    body.fs-mode main { gap: 0; }
    @media (max-width: 520px) {
      body { padding: 10px; }
      form { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      input { grid-column: 1 / -1; }
      .provider-label { justify-self: end; }
      select { width: 100%; }
      #providerFrame { min-height: calc(100vh - 145px); }
    }
  </style>
</head>
<body>
  <main>
    <form id="gameSearchForm">
      <input id="gameSearch" type="search" placeholder="Search games..." autocomplete="off">
      <label class="provider-label" for="providerSelect">Providers</label>
      <select id="providerSelect" aria-label="Providers" disabled>
        <option>Loading providers…</option>
      </select>
      <button class="primary" type="submit">Search</button>
      <button class="icon-btn" type="button" id="fsBtn" title="Fullscreen game (F11)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
          <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <iframe id="providerFrame" title="Game provider" allow="fullscreen; autoplay"></iframe>
  </main>
  <script>
    const form = document.getElementById('gameSearchForm');
    const searchInput = document.getElementById('gameSearch');
    const providerSelect = document.getElementById('providerSelect');
    const status = document.getElementById('status');
    const providerFrame = document.getElementById('providerFrame');
    const fsBtn = document.getElementById('fsBtn');
    let providers = [];
    const route = new URL(location.href);
    const routeProvider = route.searchParams.get('provider');
    const routeQuery = route.searchParams.get('q') || '';
    searchInput.value = routeQuery;

    // ── Fullscreen ──
    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen?.();
      } else {
        (providerFrame.requestFullscreen?.() || document.documentElement.requestFullscreen?.())?.catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      document.body.classList.toggle('fs-mode', isFs);
      fsBtn.title = isFs ? 'Exit fullscreen' : 'Fullscreen game (F11)';
      fsBtn.innerHTML = isFs
        ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`;
    });

    // Listen for proxied src from parent
    window.addEventListener('message', e => {
      if (e.data?.type === 'superuser:proxy-src' && typeof e.data.url === 'string') {
        providerFrame.src = e.data.url;
        status.textContent = '';
      }
    });

    function providerSlug(provider) {
      return String(provider.title || provider.name || '')
        .trim()
        .replace(/[^a-z0-9_-]/gi, '');
    }

    async function loadProviders() {
      const response = await fetch(new URL('providers.json', location.href), { cache: 'no-store' });
      if (!response.ok) throw new Error(`providers.json returned HTTP ${response.status}`);
      const data = await response.json();
      if (!Array.isArray(data)) throw new Error('providers.json must contain a list');
      providers = data.filter(provider =>
        provider && typeof provider.title === 'string' &&
        typeof provider.url === 'string' && typeof provider.search === 'string');
      if (!providers.length) throw new Error('No valid game providers were found');
      providerSelect.replaceChildren(...providers.map(provider => {
        const option = document.createElement('option');
        option.value = providerSlug(provider);
        option.textContent = provider.title;
        return option;
      }));
      const defaultProvider = providers.find(provider => provider.title.toLowerCase() === 'ugs') || providers[0];
      const selectedProvider = providers.find(provider =>
        providerSlug(provider).toLowerCase() === routeProvider?.toLowerCase()) || defaultProvider;
      providerSelect.value = providerSlug(selectedProvider);
      providerSelect.disabled = false;
      status.textContent = '';
      loadProvider(providers.find(provider => providerSlug(provider) === providerSelect.value), routeQuery);
    }

    function providerDestination(provider, query) {
      let destination;
      try {
        const candidate = provider.url.includes('://') ? provider.url : `https://${provider.url}`;
        destination = new URL(candidate);
        if (!['http:', 'https:'].includes(destination.protocol)) throw new Error('Unsupported protocol');
      } catch (_) {
        throw new Error('This provider has an invalid URL.');
      }
      if (!query) return destination.href;
      if (provider.search.startsWith('?') || provider.search.startsWith('&')) {
        const parameter = provider.search.slice(1).split('=')[0];
        if (!parameter) throw new Error('This provider has an invalid search configuration.');
        destination.searchParams.set(parameter, query);
      } else {
        destination.pathname = `${destination.pathname.replace(/\/$/, '')}${provider.search}${encodeURIComponent(query)}`;
      }
      return destination.href;
    }

    function loadProvider(provider, query = '') {
      if (!provider) return;
      providerFrame.title = `${provider.title} games`;
      if (provider.url === 'internal') {
        const destination = new URL(`${encodeURIComponent(providerSlug(provider))}/index.html`, location.href);
        if (query && (provider.search.startsWith('?') || provider.search.startsWith('&'))) {
          const parameter = provider.search.slice(1).split('=')[0];
          if (!parameter) { status.textContent = 'This provider has an invalid search configuration.'; return; }
          destination.searchParams.set(parameter, query);
        } else if (query) {
          destination.pathname += `${provider.search}${encodeURIComponent(query)}`;
        }
        providerFrame.src = destination.href;
        status.textContent = '';
        return;
      }
      // External provider: ask parent to proxy it inside the iframe
      try {
        const destUrl = providerDestination(provider, query);
        status.textContent = `Loading ${provider.title} through proxy…`;
        // Ask parent to send us the proxied src URL
        window.parent.postMessage({ type: 'superuser:get-proxy-src', url: destUrl }, location.origin);
        // Fallback: also post navigate so the parent can load it in the main tab if needed
        // We wait for 'superuser:proxy-src' message back; if none after 3s, navigate parent
        clearTimeout(loadProvider._fallback);
        loadProvider._fallback = setTimeout(() => {
          if (status.textContent && status.textContent.startsWith('Loading')) {
            window.parent.postMessage({ type: 'superuser:navigate', url: destUrl }, location.origin);
            status.textContent = '';
          }
        }, 3000);
      } catch (error) {
        status.textContent = error.message;
      }
    }

    function navigateRoute(provider, query) {
      const params = new URLSearchParams();
      params.set('provider', providerSlug(provider));
      if (query) params.set('q', query);
      window.parent.postMessage({
        type: 'superuser:navigate',
        url: `su://games?${params.toString()}`
      }, location.origin);
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const provider = providers.find(item => providerSlug(item) === providerSelect.value);
      if (!provider) return;
      const query = searchInput.value.trim();
      if (provider.url === 'internal') {
        navigateRoute(provider, query);
        return;
      }
      try {
        const destUrl = providerDestination(provider, query);
        status.textContent = `Loading ${provider.title} through proxy…`;
        window.parent.postMessage({ type: 'superuser:get-proxy-src', url: destUrl }, location.origin);
        clearTimeout(form._fallback);
        form._fallback = setTimeout(() => {
          if (status.textContent && status.textContent.startsWith('Loading')) {
            window.parent.postMessage({ type: 'superuser:navigate', url: destUrl }, location.origin);
            status.textContent = '';
          }
        }, 3000);
      } catch (error) {
        status.textContent = error.message;
      }
    });

    providerSelect.addEventListener('change', () => {
      const provider = providers.find(item => providerSlug(item) === providerSelect.value);
      if (provider) {
        if (provider.url === 'internal') {
          navigateRoute(provider, searchInput.value.trim());
        } else {
          loadProvider(provider, searchInput.value.trim());
        }
      }
    });

    loadProviders().catch(error => {
      providerSelect.replaceChildren(new Option('Providers unavailable', ''));
      status.textContent = `Could not load providers: ${error.message}`;
    });
  </script>
</body>
</html>
