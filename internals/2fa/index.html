<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2FA | SuperUser</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #121520, #09090b 70%);
      color: #f4f4f5;
      padding: 20px 18px 32px;
      display: flex; flex-direction: column; align-items: center;
    }
    main { width: min(900px, 100%); display: flex; flex-direction: column; gap: 18px; }
    h1 { font-size: 22px; font-weight: 700; color: #22c55e; }
    .subtitle { font-size: 13px; color: #a1a1aa; margin-top: 2px; }
    .card { background: #111113; border: 1px solid #27272a; border-radius: 12px; padding: 18px; }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; }
    input, select {
      background: #09090b; border: 1px solid #27272a; border-radius: 8px;
      color: #f4f4f5; font: inherit; font-size: 13px;
      padding: 0 12px; height: 38px; outline: none;
      transition: border-color 0.15s; width: 100%;
    }
    input:focus, select:focus { border-color: #22c55e; }
    button {
      background: #22c55e; border: none; border-radius: 8px;
      color: #06120a; font: inherit; font-size: 13px; font-weight: 600;
      padding: 0 16px; height: 38px; cursor: pointer;
      transition: filter 0.15s; white-space: nowrap;
    }
    button:hover { filter: brightness(1.08); }
    button.secondary {
      background: transparent; border: 1px solid #3f3f46;
      color: #a1a1aa; font-weight: 500;
    }
    button.secondary:hover { background: #18181b; color: #f4f4f5; }
    button.danger {
      background: transparent; border: 1px solid #3f3f46;
      color: #ef4444; font-weight: 500; padding: 0 10px;
    }
    button.danger:hover { background: rgba(239,68,68,0.1); border-color: #ef4444; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { font-size: 11px; color: #a1a1aa; display: block; margin-bottom: 5px; }
    .form-actions { display: flex; gap: 8px; margin-top: 12px; }
    /* 2FA code cards */
    .codes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .code-card {
      background: #0d0d0f; border: 1px solid #27272a; border-radius: 12px;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
      position: relative;
    }
    .code-card:hover { border-color: #3f3f46; }
    .code-name { font-size: 13px; font-weight: 600; }
    .code-issuer { font-size: 11px; color: #71717a; margin-top: -6px; }
    .code-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px; font-weight: 700; letter-spacing: 6px;
      color: #22c55e; text-shadow: 0 0 20px rgba(34,197,94,0.3);
    }
    .code-value.expiring { color: #f59e0b; text-shadow: 0 0 20px rgba(245,158,11,0.3); }
    .progress-bar { height: 3px; background: #27272a; border-radius: 999px; overflow: hidden; }
    .progress-fill {
      height: 100%; background: #22c55e; border-radius: 999px;
      transition: width 1s linear; transform-origin: left;
    }
    .progress-fill.expiring { background: #f59e0b; }
    .code-footer { display: flex; align-items: center; gap: 8px; }
    .code-countdown { font-size: 11px; color: #71717a; }
    .copy-btn {
      margin-left: auto; background: transparent; border: 1px solid #27272a;
      color: #a1a1aa; border-radius: 6px; padding: 0 10px; height: 30px; font-size: 12px;
    }
    .copy-btn:hover { background: #18181b; color: #22c55e; border-color: #22c55e; }
    .del-btn {
      position: absolute; top: 10px; right: 10px;
      background: transparent; border: none; color: #3f3f46;
      font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
    }
    .del-btn:hover { color: #ef4444; background: rgba(239,68,68,0.1); }
    .code-website { font-size: 10px; color: #52525b; }
    .empty-msg { text-align: center; color: #52525b; font-size: 13px; padding: 32px 0; }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #18181b; border: 1px solid #27272a; border-radius: 10px;
      padding: 10px 18px; font-size: 13px; color: #f4f4f5;
      opacity: 0; pointer-events: none; transition: all 0.25s; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: rgba(34,197,94,0.4); color: #22c55e; }
    .toast.err { border-color: rgba(239,68,68,0.4); color: #ef4444; }
    #qrUpload { display: none; }
    #qrCanvas { display: none; }
    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full { grid-column: 1; }
    }
  </style>
</head>
<body>
  <main>
    <div style="display:flex;flex-direction:column;gap:2px;padding-bottom:4px;">
      <h1>2FA Authenticator</h1>
      <div class="subtitle">Generate and manage two-factor authentication codes.</div>
    </div>

    <div class="card">
      <h2>Your Codes</h2>
      <div class="codes-grid" id="codesGrid">
        <div class="empty-msg">No 2FA accounts added yet.</div>
      </div>
    </div>

    <div class="card">
      <h2>Add Account</h2>
      <div class="form-grid">
        <div>
          <label>Account Name *</label>
          <input id="fa-name" type="text" placeholder="e.g. GitHub (user@email.com)" autocomplete="off">
        </div>
        <div>
          <label>Secret Key *</label>
          <input id="fa-secret" type="text" placeholder="JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false" style="font-family:monospace">
        </div>
        <div>
          <label>Issuer</label>
          <input id="fa-issuer" type="text" placeholder="e.g. GitHub" autocomplete="off">
        </div>
        <div>
          <label>Website (for context menu paste)</label>
          <input id="fa-website" type="text" placeholder="e.g. github.com" autocomplete="off">
        </div>
      </div>
      <div class="form-actions">
        <button id="addBtn">Add Account</button>
        <button class="secondary" id="qrBtn">📷 Scan QR Code</button>
        <input type="file" id="qrUpload" accept="image/*">
      </div>
      <canvas id="qrCanvas"></canvas>
    </div>
  </main>
  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const ACCOUNTS_KEY = 'superuser-2fa-accounts';
    let accounts = [];

    function loadAccounts() {
      try { accounts = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]'); } catch (_) { accounts = []; }
    }
    function saveAccounts() {
      localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts));
      try { window.parent.postMessage({ type: 'superuser:2fa-updated', accounts }, '*'); } catch (_) {}
    }

    function toast(msg, type = 'ok') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2800);
    }

    function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }

    // ── TOTP Implementation ──
    async function totp(secret, period = 30, digits = 6) {
      const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      let bits = '';
      for (const c of secret.toUpperCase().replace(/[\s=]/g, '')) {
        const i = alpha.indexOf(c);
        if (i < 0) continue;
        bits += i.toString(2).padStart(5, '0');
      }
      const keyBytes = new Uint8Array(Math.floor(bits.length / 8));
      for (let i = 0; i < keyBytes.length; i++) keyBytes[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
      const counter = BigInt(Math.floor(Date.now() / 1000 / period));
      const cb = new Uint8Array(8);
      let tmp = counter;
      for (let i = 7; i >= 0; i--) { cb[i] = Number(tmp & 0xffn); tmp >>= 8n; }
      const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
      const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, cb));
      const off = sig[sig.length - 1] & 0x0f;
      const code = ((sig[off] & 0x7f) << 24 | (sig[off + 1] & 0xff) << 16 | (sig[off + 2] & 0xff) << 8 | (sig[off + 3] & 0xff)) % (10 ** digits);
      return String(code).padStart(digits, '0');
    }

    function remaining(period = 30) {
      return period - (Math.floor(Date.now() / 1000) % period);
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function renderCodes() {
      const grid = document.getElementById('codesGrid');
      if (!accounts.length) {
        grid.innerHTML = '<div class="empty-msg">No 2FA accounts added yet.<br>Add one below or scan a QR code.</div>';
        return;
      }
      const codes = await Promise.all(accounts.map(a => totp(a.secret, a.period || 30, a.digits || 6).catch(() => '------')));
      grid.innerHTML = accounts.map((acc, i) => {
        const rem = remaining(acc.period || 30);
        const pct = (rem / (acc.period || 30)) * 100;
        const expiring = rem <= 5;
        return `
        <div class="code-card" data-idx="${i}">
          <button class="del-btn" data-del="${i}" title="Remove">✕</button>
          <div class="code-name">${escHtml(acc.name)}</div>
          ${acc.issuer ? `<div class="code-issuer">${escHtml(acc.issuer)}</div>` : ''}
          ${acc.website ? `<div class="code-website">${escHtml(acc.website)}</div>` : ''}
          <div class="code-value${expiring ? ' expiring' : ''}" id="code-${i}">${codes[i]}</div>
          <div class="progress-bar"><div class="progress-fill${expiring ? ' expiring' : ''}" id="prog-${i}" style="width:${pct}%"></div></div>
          <div class="code-footer">
            <span class="code-countdown" id="rem-${i}">${rem}s</span>
            <button class="copy-btn" data-copy="${i}">Copy</button>
          </div>
        </div>`;
      }).join('');

      grid.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', e => {
          const idx = parseInt(e.target.dataset.del);
          const acc = accounts[idx];
          if (!confirm(`Remove "${acc.name}"?`)) return;
          accounts.splice(idx, 1);
          saveAccounts();
          renderCodes();
          toast('Removed account');
        });
      });

      grid.querySelectorAll('[data-copy]').forEach(btn => {
        btn.addEventListener('click', async e => {
          const idx = parseInt(e.target.dataset.copy);
          const code = document.getElementById(`code-${idx}`)?.textContent || '';
          await navigator.clipboard.writeText(code).catch(() => {});
          btn.textContent = 'Copied!';
          setTimeout(() => btn.textContent = 'Copy', 1200);
          toast('Code copied!');
        });
      });
    }

    async function tickCodes() {
      const now = Math.floor(Date.now() / 1000);
      for (let i = 0; i < accounts.length; i++) {
        const acc = accounts[i];
        const period = acc.period || 30;
        const rem = period - (now % period);
        const pct = (rem / period) * 100;
        const expiring = rem <= 5;
        const remEl = document.getElementById(`rem-${i}`);
        const progEl = document.getElementById(`prog-${i}`);
        const codeEl = document.getElementById(`code-${i}`);
        if (remEl) remEl.textContent = `${rem}s`;
        if (progEl) {
          progEl.style.width = pct + '%';
          progEl.classList.toggle('expiring', expiring);
        }
        if (codeEl) codeEl.classList.toggle('expiring', expiring);
        // Refresh code when counter changes
        if (rem === period) {
          try {
            const newCode = await totp(acc.secret, period, acc.digits || 6);
            if (codeEl) codeEl.textContent = newCode;
          } catch (_) {}
        }
      }
    }

    document.getElementById('addBtn').addEventListener('click', async () => {
      const name = document.getElementById('fa-name').value.trim();
      const secret = document.getElementById('fa-secret').value.trim().replace(/\s/g,'');
      const issuer = document.getElementById('fa-issuer').value.trim();
      const website = document.getElementById('fa-website').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
      if (!name) { toast('Enter an account name', 'err'); return; }
      if (!secret) { toast('Enter a secret key', 'err'); return; }
      // Test that it generates
      try { await totp(secret); } catch (_) { toast('Invalid secret key', 'err'); return; }
      accounts.push({ id: uid(), name, secret, issuer, website, digits: 6, period: 30 });
      saveAccounts();
      ['fa-name','fa-secret','fa-issuer','fa-website'].forEach(id => document.getElementById(id).value = '');
      await renderCodes();
      toast('Account added!');
    });

    // QR Code scanning
    document.getElementById('qrBtn').addEventListener('click', () => {
      document.getElementById('qrUpload').click();
    });

    document.getElementById('qrUpload').addEventListener('change', async e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.getElementById('qrCanvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        if (typeof jsQR === 'undefined') { toast('QR library not loaded yet, try again', 'err'); return; }
        const result = jsQR(imageData.data, imageData.width, imageData.height);
        if (!result) { toast('No QR code found in image', 'err'); return; }
        const uri = result.data;
        // Parse otpauth://totp/Issuer:Name?secret=XXX&issuer=YYY
        try {
          const url = new URL(uri);
          if (url.protocol !== 'otpauth:') throw new Error('Not an OTP URI');
          const label = decodeURIComponent(url.pathname.slice(1)); // remove leading /
          const parts = label.includes(':') ? label.split(':') : [null, label];
          const issuer = url.searchParams.get('issuer') || parts[0] || '';
          const name = parts[parts.length - 1] || label;
          const secret = url.searchParams.get('secret') || '';
          const digits = parseInt(url.searchParams.get('digits') || '6') || 6;
          const period = parseInt(url.searchParams.get('period') || '30') || 30;
          document.getElementById('fa-name').value = name;
          document.getElementById('fa-secret').value = secret;
          document.getElementById('fa-issuer').value = issuer;
          toast('QR parsed! Review and click Add Account.');
        } catch (_) {
          toast('Could not parse OTP URI from QR', 'err');
        }
        URL.revokeObjectURL(img.src);
      };
      e.target.value = '';
    });

    async function init() {
      loadAccounts();
      await renderCodes();
      setInterval(tickCodes, 1000);
    }

    init();
  </script>
</body>
</html>
